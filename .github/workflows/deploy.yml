# ─────────────────────────────────────────────────────────────
# Deploy Pipeline — Group 1 Lancaster Travel Routes
# Runs on push to `main` only (after PR merge).
# Builds container images, pushes to GitHub Container Registry,
# and tags a release so lab machines can always pull the latest.
# ─────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]

# Ensure only one deploy runs at a time
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/group1

jobs:
  # ──────────────── Build & Push Images ────────────────
  build-and-push:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Frontend ──
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

      # ── Backend ──
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      # ── Database ──
      - name: Build & push database image
        uses: docker/build-push-action@v5
        with:
          context: ./postgres
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-db:latest
            ${{ env.IMAGE_PREFIX }}-db:${{ github.sha }}

  # ──────────────── Tag Release ────────────────
  tag-release:
    name: Create Git Tag
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          # Auto-increment: find latest v* tag, bump patch
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            NEW_TAG="v0.1.0"
          else
            # Extract major.minor.patch and increment patch
            MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $NEW_TAG"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Container Images

            Pull the latest images on lab machines:
            ```bash
            podman pull ${{ env.IMAGE_PREFIX }}-frontend:latest
            podman pull ${{ env.IMAGE_PREFIX }}-backend:latest
            podman pull ${{ env.IMAGE_PREFIX }}-db:latest
            ```

            Or use the pinned SHA images:
            ```
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-db:${{ github.sha }}
            ```
