version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: group1db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: group1
      POSTGRES_DB: group1db
    ports:
      - "5050:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/group1db_backup.sql:/docker-entrypoint-initdb.d/01_restore.sql
      - ./postgres/post_restore.sql:/docker-entrypoint-initdb.d/02_post_restore.sql
      - ./postgres/auth_schema.sql:/docker-entrypoint-initdb.d/03_auth_schema.sql
    networks:
      - group1-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: group1-backend
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: group1db
      DB_USER: postgres
      DB_PASSWORD: group1
      SESSION_SECRET: ${SESSION_SECRET:-lancaster-travel-production-secret-change-me}
      CORS_ORIGIN: http://localhost:5101
      APP_URL: http://localhost:5101
      # SMTP settings (optional – dev mode logs emails to console)
      # SMTP_HOST: smtp.example.com
      # SMTP_PORT: 587
      # SMTP_USER: user@example.com
      # SMTP_PASS: password
      # SMTP_FROM: noreply@lancastertravel.app
    ports:
      - "5100:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - group1-net
    restart: unless-stopped

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5100
    container_name: group1-frontend
    ports:
      - "5101:5001"
    depends_on:
      - backend
    networks:
      - group1-net
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5100

volumes:
  postgres_data:

networks:
  group1-net:
    driver: bridge
